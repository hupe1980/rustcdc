name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `rust-version` in Cargo.toml is a promise to downstream consumers. Without a job
  # pinned to it, the promise is only ever tested against whatever `stable` happens to be,
  # and a newer-than-MSRV feature ships unnoticed.
  #
  # The toolchain is **read from the manifest** rather than written here. This job used to
  # hardcode `1.94.0` while the manifest said `1.94`: two sources of truth for one number,
  # and exactly how they drift. A dependency raised its own requirement, the pinned job
  # started failing, and nothing said which of the two values was wrong.
  # `crates/rustcdc-server/tests/architecture.rs` asserts this job derives rather than restates.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          test -n "$version" || { echo "no rust-version in [workspace.package]"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV is $version"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/build-deps
      - name: cargo check -p rustcdc --no-default-features (msrv)
        run: cargo check -p rustcdc --no-default-features
      - name: cargo check -p rustcdc --features default (msrv)
        run: cargo check -p rustcdc --features default
      - name: cargo test -p rustcdc --lib --features default (msrv)
        run: cargo test -p rustcdc --lib --features default
      # The server is the other half of the MSRV promise, and it has the higher floor
      # (the AWS SDK). Checking only the library would let the shipped binary need a
      # newer toolchain than the manifest declares.
      - name: cargo check -p rustcdc-server --all-targets --all-features (msrv)
        run: cargo check -p rustcdc-server --all-targets --all-features --locked

  check:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is required, not optional: the Win32 PID-liveness probe in
        # checkpoint::owner_lease is the crate's only `unsafe` block, and a
        # `#![forbid(unsafe_code)]` at the crate root made it impossible to compile for
        # any *-pc-windows-* target. That break was invisible for as long as the matrix
        # was Linux + macOS only. Keep Windows here so it cannot regress silently.
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, nightly]
        profile:
          - { name: no-default-features, args: "--no-default-features" }
          - { name: default-features, args: "--features default" }
          - { name: all-features, args: "--all-features" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo check -p rustcdc (${{ matrix.profile.name }})
        run: cargo check -p rustcdc ${{ matrix.profile.args }}
      - name: cargo test -p rustcdc --lib (${{ matrix.profile.name }})
        run: cargo test -p rustcdc --lib ${{ matrix.profile.args }}
      - name: cargo build --example suite (stable ubuntu)
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: |
          cargo build --example pg_to_stdout --features postgres
          cargo build --example postgres_to_otel --features postgres,metrics
          cargo build --example sqlserver_to_otel --features sqlserver,metrics
          cargo build --example regex_filter_transform
          cargo build --example uppercase_transform

  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, nightly]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Clippy is workspace-wide and therefore compiles the server, whose dependency
      # graph (aws-lc-rs, parquet, wasmtime) needs a C toolchain.
      - uses: ./.github/actions/build-deps
        if: runner.os == 'Linux'
      # `--all`, not the default: without it `cargo fmt` formats only the package in the
      # current directory, so every file under `crates/rustcdc-server/` and `crates/crash-workers/` went unchecked.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check
      # Workspace-wide on purpose. Both members are the product; linting only the library
      # would leave the shipped binary's code unchecked, which is what two repositories
      # with two CI configurations had already achieved by accident.
      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # `missing_docs` is `deny` at the crate root, so this also fails on any
      # undocumented public item. The backfill that made it pass covered 416 items;
      # leaving the lint off would let that decay immediately.
      - name: cargo doc -p rustcdc --all-features --no-deps
        run: cargo doc -p rustcdc --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      # The all-features build cannot see a broken link *into* a feature-gated item,
      # because every gate is on. Twelve such links existed and were invisible for exactly
      # that reason: an intra-doc link from an ungated doc comment to a `schemreg`, `tls`,
      # `sqlserver` or `encryption` item resolves only when that feature happens to be
      # enabled, and is a broken link in every other build — including the one a downstream
      # crate gets when it runs `cargo doc` on its own dependency set.
      #
      # `--no-default-features` is the complementary extreme; between the two, an ungated
      # item cannot link to a gated one without one of the lanes failing.
      - name: cargo doc -p rustcdc --no-default-features --no-deps
        run: cargo doc -p rustcdc --no-default-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      # Compiles every Rust block in README.md and docs/*.md as well as the rustdoc
      # examples. Published samples that no longer compile are integration failures
      # waiting to happen; before this ran, 36 of 96 documented samples were broken.
      # See `markdown_doctests` in src/lib.rs.
      - name: cargo test -p rustcdc --doc --all-features (rustdoc + Markdown samples)
        run: cargo test -p rustcdc --doc --all-features

  transport-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test -p rustcdc --lib --features postgres,tls
        run: cargo test -p rustcdc --lib --features postgres,tls
      - name: cargo test -p rustcdc --lib --features mysql,tls
        run: cargo test -p rustcdc --lib --features mysql,tls
      - name: cargo test -p rustcdc --lib --features sqlserver,tls
        run: cargo test -p rustcdc --lib --features sqlserver,tls
      # `snowflake` alone, with no `tls` and no other connector: the feature adds no
      # dependencies and must therefore build against the bare foundation. Testing it only
      # under `--all-features` would hide a dependency it accidentally picked up from a
      # sibling feature.
      - name: cargo test -p rustcdc --lib --features snowflake
        run: cargo test -p rustcdc --lib --features snowflake

  policy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install policy gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep jq
      # The policy gate validates the documentation site's internal links via
      # `zola check`, so zola has to be on PATH for that part to run rather than skip.
      - name: install zola
        run: |
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin zola
          zola --version
        env:
          ZOLA_VERSION: 0.23.4
      - name: policy gates (schema + deprecated + workflow drift)
        run: bash scripts/ci-policy-gate.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check (advisories + licenses + bans + sources)
        run: cargo deny check

  docs-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install zola
        run: |
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin zola
          zola --version
        env:
          ZOLA_VERSION: 0.23.4
      # `zola check` resolves every internal `@/...` link and fetches external ones.
      # A broken cross-reference fails here rather than shipping to the published site.
      - name: check documentation site
        run: zola --root site check
      - name: build documentation site
        run: zola --root site build
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/public
          retention-days: 7

  correctness-smoke:
    runs-on: ubuntu-latest
    env:
      CDC_RS_RUN_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: pre-pull postgres image (public ecr mirror)
        run: bash scripts/ci-pull-relational-images.sh 16-alpine
      - name: pre-pull mysql/mariadb images
        run: bash scripts/ci-pull-relational-images.sh --relational-smoke
      - name: contract compatibility smoke
        run: cargo test -p rustcdc --test compatibility_contract --all-features
      - name: postgres checkpoint durability smoke
        run: cargo test -p rustcdc --test checkpoint_file_integration --features postgres
      - name: postgres process-crash replay smoke
        run: cargo test -p rustcdc --test runtime_postgres_process_crash_integration --features postgres --bins
      - name: reliability data-loss smoke
        run: cargo test -p rustcdc --test data_loss_detection --features postgres,test-harnesses
      - name: mysql connection integration smoke
        run: cargo test -p rustcdc --test mysql_connection_integration --features mysql
      - name: mariadb connection integration smoke
        run: cargo test -p rustcdc --test mariadb_connection_integration --features mariadb
      - name: sqlserver connection integration smoke
        run: cargo test -p rustcdc --test sqlserver_connection_integration --features sqlserver
      - name: mysql process-crash replay smoke
        run: cargo test -p rustcdc --test runtime_mysql_process_crash_integration --features mysql --bins
      - name: mariadb process-crash replay smoke
        run: cargo test -p rustcdc --test runtime_mariadb_process_crash_integration --features mariadb --bins
      - name: sqlserver process-crash replay smoke
        run: cargo test -p rustcdc --test runtime_sqlserver_process_crash_integration --features sqlserver --bins

  reliability-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - deterministic_replay_failure_fixtures
          - deterministic_replay_golden_fixtures
          - runtime_health_states
          - wasm_conformance_contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: reliability core suite (${{ matrix.suite }})
        run: cargo test -p rustcdc --test ${{ matrix.suite }} --features postgres,wasm,test-harnesses

  latency-core:
    runs-on: ubuntu-latest
    env:
      CDC_RS_RUN_DOCKER_TESTS: "1"
      LATENCY_GATE_DEFAULT_P95_MS: "500"
      LATENCY_GATE_DEFAULT_P99_MS: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: pre-pull postgres image (public ecr mirror)
        run: bash scripts/ci-pull-relational-images.sh 16-alpine
      - name: connector-backed latency evidence gate (p95/p99)
        run: bash scripts/ci-latency-gate.sh

  integration-postgres:
    runs-on: ubuntu-latest
    env:
      CDC_RS_RUN_DOCKER_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        suite:
          - runtime_postgres
          - postgres_version_matrix
          - postgres_snapshot_integration
          - postgres_stream_integration
          - postgres_wal_transport_parity_integration
          - postgres_incremental_snapshot_reconnect_integration
          # The two transaction-id scales in the snapshot watermark bracket must agree.
          # pg_snapshot_xip yields epoch-extended xid8; pgoutput's BEGIN carries a bare
          # 32-bit xid. If the reduction between them is wrong the in-flight set silently
          # never matches, the bracket degrades to the position-only test it replaced, and
          # the commit-visibility race is back with every driver-level test still green —
          # those use a fake backend that defines both scales itself.
          - postgres_snapshot_visibility_integration
          # Per-table snapshot row filter: bounds the chunk reads, must not bound the stream.
          - postgres_snapshot_filter_integration
          # The same column must have the same JSON type whichever path it arrived by.
          # Nothing asserted this before, so snapshot and stream disagreed silently.
          - postgres_value_representation_integration
          # A clean restart with no new writes must deliver nothing. Guards the resume
          # coordinate: PostgreSQL logical decoding filters at transaction granularity, so
          # checkpointing a change's own LSN replays its whole transaction on every restart.
          - postgres_restart_resume_integration
          - postgres_query_integration
          # Smoke-tests the shipped example end to end. An example that no longer runs is a
          # broken first impression, and nothing else compiles-and-runs it.
          - example_pg_to_stdout
          # Type fidelity + REPLICA IDENTITY DEFAULT. Every other integration schema is
          # BIGINT + TEXT, and that gap is what let a silent null-decoding defect survive
          # in the SQL Server connector.
          - postgres_type_fidelity_integration
          # A Runtime driven against REPLICA IDENTITY DEFAULT, updating a non-key column.
          # Every other Runtime-level suite forces REPLICA IDENTITY FULL in its fixture, so
          # the pre-image was always present and the envelope contract for its absence went
          # unexercised — an UPDATE on a stock table halted the pipeline unrecoverably and
          # the suite stayed green. Source-level tests cannot cover it: validation runs at
          # runtime ingress, not in the source.
          - postgres_replica_identity_default_runtime_integration
          - postgres_handoff_integration
          - checkpoint_file_integration
          - runtime_postgres_process_crash_integration
          - parallel_snapshot_stress_integration
          - otel_metrics_integration
          - otel_tracing_integration
          - snapshot_resumable_integration
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: pre-pull postgres images (public ecr mirror)
        run: |
          tags="16-alpine"
          if [[ "${{ matrix.suite }}" == "postgres_version_matrix" ]]; then
            tags="12-alpine 14-alpine 15-alpine 16-alpine"
          fi
          bash scripts/ci-pull-relational-images.sh ${tags}
      - name: cargo test -p rustcdc --test ${{ matrix.suite }}
        if: matrix.suite != 'runtime_postgres_process_crash_integration' && matrix.suite != 'otel_metrics_integration' && matrix.suite != 'otel_tracing_integration' && matrix.suite != 'example_pg_to_stdout'
        run: cargo test -p rustcdc --test ${{ matrix.suite }} --features postgres
      # The test builds the example itself (`cargo build --example pg_to_stdout`) before spawning
      # it, so no extra target selection is needed. It used to pass `--examples --tests`, and
      # `--tests` selects *every* test target — so this matrix entry ran the whole integration
      # suite and reported unrelated failures under this job's name.
      - name: cargo test -p rustcdc --test example_pg_to_stdout
        if: matrix.suite == 'example_pg_to_stdout'
        run: cargo test -p rustcdc --test example_pg_to_stdout --features postgres
      - name: cargo test -p rustcdc --test ${{ matrix.suite }} (metrics)
        if: matrix.suite == 'otel_metrics_integration' || matrix.suite == 'otel_tracing_integration'
        run: cargo test -p rustcdc --test ${{ matrix.suite }} --features postgres,metrics
      - name: cargo test -p rustcdc --test runtime_postgres_process_crash_integration (with bins)
        if: matrix.suite == 'runtime_postgres_process_crash_integration'
        run: cargo test -p rustcdc --test runtime_postgres_process_crash_integration --features postgres --bins

  integration-postgres-encryption:
    runs-on: ubuntu-latest
    env:
      CDC_RS_RUN_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: pre-pull postgres images (public ecr mirror)
        run: bash scripts/ci-pull-relational-images.sh 16-alpine
      - name: cargo test -p rustcdc --test runtime_postgres_process_crash_integration --features postgres,encryption --bins
        run: cargo test -p rustcdc --test runtime_postgres_process_crash_integration --features postgres,encryption --bins

  integration-reliability:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - data_loss_detection
          - deterministic_replay_failure_fixtures
          - deterministic_replay_golden_fixtures
          - runtime_health_states
          - fault_injection_soak_matrix
          # Model-level checks of the crash-recovery *validator*. The real process-kill
          # tests live in the per-connector integration jobs; this is what makes the
          # validator itself trustworthy when pointed at one.
          - crash_recovery_model
          # `register_source` is the crate's headline claim for third-party connectors.
          # Driving it end to end is what stops that claim rotting.
          - custom_source_end_to_end
          - snapshot_validator_integration
          - logging_structured
          - wasm_runtime_integration
          - wasm_conformance_contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test -p rustcdc --test ${{ matrix.suite }} --features postgres,wasm,test-harnesses
        run: cargo test -p rustcdc --test ${{ matrix.suite }} --features postgres,wasm,test-harnesses

  integration-schema-registry:
    runs-on: ubuntu-latest
    env:
      CDC_RS_RUN_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # Apicurio Registry 3 serves both its native v3 API and a Confluent-compatible one,
      # so a single container exercises both client paths. "Compiles" is not evidence for
      # a network-facing client: this suite found an Avro decoder that had never decoded
      # an event and a JSON Schema that rejected every INSERT.
      - name: cargo test -p rustcdc --test schema_registry_live_integration
        run: cargo test -p rustcdc --test schema_registry_live_integration --features schemreg,apicurio,avro -- --test-threads=1

  integration-mysql:
    runs-on: ubuntu-latest
    env:
      CDC_RS_RUN_DOCKER_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        suite:
          - mysql_version_matrix
          - mysql_connection_integration
          - mysql_snapshot_integration
          - mysql_type_fidelity_integration
          # The MySQL GTID watermark: the event's GTID and Executed_Gtid_Set must be
          # the same identifiers, or set membership silently never matches and the
          # bracket degrades to the ordinal test with every unit test still green.
          - mysql_gtid_watermark_integration
          - mysql_stream_integration
          - mysql_binlog_compression_integration
          - mysql_handoff_integration
          # A clean restart with no new writes must deliver nothing. Also asserts the
          # resume coordinate carries no raw checksum bytes — MariaDB appends a CRC32 to
          # the ROTATE event's file name, which corrupted the checkpoint and both broke
          # file+position resume and silently disabled the rewind guard.
          - mysql_restart_resume_integration
          - runtime_mysql_process_crash_integration
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: pre-pull mysql/mariadb images
        run: bash scripts/ci-pull-relational-images.sh --relational-smoke
      - name: cargo test -p rustcdc --test ${{ matrix.suite }}
        if: matrix.suite != 'runtime_mysql_process_crash_integration' && matrix.suite != 'mysql_restart_resume_integration'
        run: cargo test -p rustcdc --test ${{ matrix.suite }} --features mysql
      # Covers MySQL and MariaDB in one suite, so it needs both features.
      - name: cargo test -p rustcdc --test mysql_restart_resume_integration (mysql + mariadb)
        if: matrix.suite == 'mysql_restart_resume_integration'
        run: cargo test -p rustcdc --test mysql_restart_resume_integration --features mysql,mariadb -- --test-threads=1
      - name: cargo test -p rustcdc --test runtime_mysql_process_crash_integration (with bins)
        if: matrix.suite == 'runtime_mysql_process_crash_integration'
        run: cargo test -p rustcdc --test runtime_mysql_process_crash_integration --features mysql --bins

  integration-mysql-encryption:
    runs-on: ubuntu-latest
    env:
      CDC_RS_RUN_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: pre-pull mysql/mariadb images
        run: bash scripts/ci-pull-relational-images.sh --relational-smoke
      - name: cargo test -p rustcdc --test runtime_mysql_process_crash_integration --features mysql,encryption --bins
        run: cargo test -p rustcdc --test runtime_mysql_process_crash_integration --features mysql,encryption --bins

  integration-mariadb:
    runs-on: ubuntu-latest
    env:
      CDC_RS_RUN_DOCKER_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        suite:
          - mariadb_connection_integration
          - mariadb_e2e_integration
          - runtime_mariadb_process_crash_integration
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: pre-pull mysql/mariadb images
        run: bash scripts/ci-pull-relational-images.sh --relational-smoke
      - name: cargo test -p rustcdc --test ${{ matrix.suite }}
        if: matrix.suite != 'runtime_mariadb_process_crash_integration'
        run: cargo test -p rustcdc --test ${{ matrix.suite }} --features mariadb
      - name: cargo test -p rustcdc --test runtime_mariadb_process_crash_integration (with bins)
        if: matrix.suite == 'runtime_mariadb_process_crash_integration'
        run: cargo test -p rustcdc --test runtime_mariadb_process_crash_integration --features mariadb --bins

  integration-mariadb-encryption:
    runs-on: ubuntu-latest
    env:
      CDC_RS_RUN_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: pre-pull mysql/mariadb images
        run: bash scripts/ci-pull-relational-images.sh --relational-smoke
      - name: cargo test -p rustcdc --test runtime_mariadb_process_crash_integration --features mariadb,encryption --bins
        run: cargo test -p rustcdc --test runtime_mariadb_process_crash_integration --features mariadb,encryption --bins

  integration-sqlserver:
    runs-on: ubuntu-latest
    env:
      CDC_RS_RUN_DOCKER_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        suite:
          - sqlserver_version_matrix
          - sqlserver_snapshot_integration
          - sqlserver_type_fidelity_integration
          - sqlserver_stream_integration
          - sqlserver_window_truncation_integration
          # A change committed after a long idle period must still be captured. The idle
          # phase deliberately withholds sp_cdc_scan so the harvested maximum stands
          # still — forcing a scan would keep it advancing and mask the creep entirely.
          - sqlserver_idle_window_integration
          - sqlserver_handoff_integration
          - runtime_sqlserver_process_crash_integration
          - sqlserver_to_otel_example_integration
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: pre-pull SQL Server image (soft — MCR downtime or retired tag skips tests, not CI)
        run: bash scripts/ci-pull-relational-images.sh --sqlserver-soft 2022-latest
      - name: cargo test -p rustcdc --test ${{ matrix.suite }}
        if: matrix.suite != 'runtime_sqlserver_process_crash_integration' && matrix.suite != 'sqlserver_to_otel_example_integration'
        run: cargo test -p rustcdc --test ${{ matrix.suite }} --features sqlserver
      # The test builds the example itself (`cargo build --example sqlserver_to_otel`) before
      # spawning it, so no extra target selection is needed here. It used to pass
      # `--examples --tests`, and `--tests` selects *every* test target — so this matrix entry ran
      # the whole integration suite, and a PostgreSQL failure was reported as a SQL Server one.
      - name: cargo test -p rustcdc --test sqlserver_to_otel_example_integration
        if: matrix.suite == 'sqlserver_to_otel_example_integration'
        run: cargo test -p rustcdc --test sqlserver_to_otel_example_integration --features sqlserver,metrics
      - name: cargo test -p rustcdc --test runtime_sqlserver_process_crash_integration (with bins)
        if: matrix.suite == 'runtime_sqlserver_process_crash_integration'
        run: cargo test -p rustcdc --test runtime_sqlserver_process_crash_integration --features sqlserver --bins

  integration-sqlserver-encryption:
    runs-on: ubuntu-latest
    env:
      CDC_RS_RUN_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: pre-pull SQL Server image (soft — MCR downtime or retired tag skips tests, not CI)
        run: bash scripts/ci-pull-relational-images.sh --sqlserver-soft 2022-latest
      - name: cargo test -p rustcdc --test runtime_sqlserver_process_crash_integration --features sqlserver,encryption --bins
        run: cargo test -p rustcdc --test runtime_sqlserver_process_crash_integration --features sqlserver,encryption --bins

  release-evidence:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - msrv
      - check
      - quality
      - transport-security
      - policy-gate
      - correctness-smoke
      - reliability-core
      - latency-core
      - integration-postgres
      - integration-postgres-encryption
      - integration-reliability
      - integration-mysql
      - integration-mysql-encryption
      - integration-mariadb
      - integration-mariadb-encryption
      - integration-sqlserver
      - integration-sqlserver-encryption
    runs-on: ubuntu-latest
    env:
      CDC_RS_RUN_DOCKER_TESTS: "1"
      BENCHMARK_STRICT: "1"
      BENCHMARK_REQUIRE_HISTORICAL_BASELINE: "1"
      BENCHMARK_ENFORCE_RELEASE_POLICY: "1"
      CRITERION_BASELINE: ci-baseline
      BENCHMARK_CRITICAL_GROUP_PREFIXES: "quality_perf/quality_gates cdc_perf/quality_gates cdc_perf/wasm_transform"
      LATENCY_GATE_DEFAULT_P95_MS: "500"
      LATENCY_GATE_DEFAULT_P99_MS: "1000"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install release evidence dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep jq
          cargo install cargo-deny --locked

      - name: derive benchmark baseline inputs
        env:
          CONFIGURED_BASELINE_COMMIT: ${{ vars.BENCHMARK_BASELINE_COMMIT }}
          CONFIGURED_BASELINE_ARTIFACT: ${{ vars.BENCHMARK_BASELINE_ARTIFACT }}
        run: |
          set -euo pipefail

          baseline_commit="${CONFIGURED_BASELINE_COMMIT}"
          baseline_artifact="${CONFIGURED_BASELINE_ARTIFACT}"

          if [ -z "$baseline_commit" ]; then
            # Auto-detect baseline from git history:
            # 1. Try the most recent prior release tag.
            # 2. Fall back to HEAD~1 (parent commit).
            # 3. If this is the initial commit with no parent, use HEAD itself
            #    and disable the historical-baseline requirement for this run.
            prior_tag_commit="$(git log --tags --no-walk --pretty=format:'%H' 2>/dev/null | head -1 || true)"
            if [ -n "$prior_tag_commit" ] && [ "$prior_tag_commit" != "$(git rev-parse HEAD)" ]; then
              baseline_commit="$prior_tag_commit"
              echo "::notice::BENCHMARK_BASELINE_COMMIT not configured — auto-detected from most recent release tag: ${baseline_commit:0:12}. Set the 'BENCHMARK_BASELINE_COMMIT' repository variable to a specific SHA for reproducible release evidence."
            elif git rev-parse HEAD~1 >/dev/null 2>&1; then
              baseline_commit="$(git rev-parse HEAD~1)"
              echo "::notice::BENCHMARK_BASELINE_COMMIT not configured — falling back to HEAD~1: ${baseline_commit:0:12}. Set the 'BENCHMARK_BASELINE_COMMIT' repository variable to a known-good commit SHA for reproducible release evidence."
            else
              # Initial commit: no ancestor exists — bootstrap mode.
              baseline_commit="$(git rev-parse HEAD)"
              echo "BENCHMARK_REQUIRE_HISTORICAL_BASELINE=0" >> "$GITHUB_ENV"
              echo "BENCHMARK_ENFORCE_RELEASE_POLICY=0" >> "$GITHUB_ENV"
              echo "::notice::BENCHMARK_BASELINE_COMMIT not configured and no prior commit found — running in bootstrap mode (no regression comparison, release policy not enforced)."
            fi
          fi

          if [ -z "$baseline_artifact" ]; then
            baseline_artifact="commit:${baseline_commit}"
          fi

          echo "BENCHMARK_BASELINE_COMMIT=$baseline_commit" >> "$GITHUB_ENV"
          echo "BENCHMARK_BASELINE_ARTIFACT=$baseline_artifact" >> "$GITHUB_ENV"

      - name: policy gate
        run: bash scripts/ci-policy-gate.sh

      - name: cargo deny check (advisories + licenses + bans + sources)
        run: cargo deny check

      - name: clear stale criterion baseline cache
        run: |
          # Remove any Criterion baseline cached from a prior crate version
          # (Swatinem/rust-cache persists target/ across Cargo.lock-stable runs).
          # Clearing here forces ensure_named_baseline to bootstrap against the
          # current commit so the gate compares like-for-like.
          rm -rf target/criterion

      - name: benchmark policy gate
        run: bash scripts/ci-benchmark-gate.sh

      # Warm every image the matrix instantiates, from the ECR public mirror rather than
      # rate-limited Docker Hub.
      #
      # This job runs 38 container suites and had no pre-pull at all, so every image was
      # fetched on demand from exactly the registry `ci-pull-relational-images.sh` exists to
      # avoid — while the policy gate's `run_relational_image_drift_check` carefully kept
      # that script's list in step with the matrices for a job that never called it. It
      # matters more now that an image-pull failure fails the evidence gate instead of being
      # silently counted as a pass.
      - name: pre-pull relational images (MySQL, MariaDB)
        run: bash scripts/ci-pull-relational-images.sh --relational-smoke
      - name: pre-pull postgres images used by the version matrix
        run: bash scripts/ci-pull-relational-images.sh 12-alpine 14-alpine 15-alpine 16-alpine

      - name: full integration matrix evidence
        run: bash scripts/run_full_integration_matrix_evidence.sh

      - name: upload release-gate evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence
          path: |
            target/integration-full-matrix-evidence.txt
            target/latency-evidence.txt
            target/latency-gate.txt
            target/postgres-latency-evidence.json
            target/postgres-latency-evidence.md
            target/mysql-latency-evidence.json
            target/mysql-latency-evidence.md
            target/sqlserver-latency-evidence.json
            target/sqlserver-latency-evidence.md
            target/benchmark-ci-gate*.txt
            target/benchmark-ci-env.txt
            target/criterion
            BENCHMARK_REPORT.md
  # ── The published artefact, built on every pull request ──────────────────────
  #
  # `cargo package` is not `cargo build`. It collects the files the `.crate` will
  # actually contain and then builds *from that copy*, so it is the only thing that
  # catches a crate which compiles in the repository and not from the registry: a file
  # outside the package root, an `include_str!` reaching for something `exclude` removed,
  # a `build.rs` input nobody packaged.
  #
  # Running it only at release time means discovering that on the tag, with the version
  # already burned. Running it here means a broken package fails the pull request that
  # broke it.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/build-deps
      # Verification build included — that is the whole point of the job.
      - name: cargo package -p rustcdc
        run: cargo package -p rustcdc --locked
      # A `.crate` that quietly grew by an order of magnitude is a packaging mistake
      # (a fixture tree, a corpus, a `target/` escape), and crates.io rejects above 10 MiB.
      - name: report the packaged size
        run: |
          set -euo pipefail
          crate="$(ls target/package/rustcdc-*.crate)"
          bytes="$(wc -c < "$crate")"
          echo "$crate is $((bytes / 1024)) KiB"
          if [ "$bytes" -gt 9437184 ]; then
            echo "::error::the packaged crate is within 1 MiB of the crates.io 10 MiB limit"
            exit 1
          fi

  # ── The image builds, checked on every pull request ─────────────────────────
  #
  # Nothing built the container outside a release, so a Dockerfile that stopped working —
  # a renamed directory, a `.dockerignore` entry that removed a file the build needs, a
  # base image that moved — was discovered on the tag, after the crate had published.
  #
  # `push: false`: this proves the image *builds*. Publishing it is `release.yml`, which
  # runs only on a tag. One platform is enough for a smoke test; the release matrix
  # covers both natively.
  container-smoke:
    name: Container image builds
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=container-smoke
          cache-to: type=gha,scope=container-smoke,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  # rustcdc-server
  # ───────────────────────────────────────────────────────────────────────────
  #
  # Merged in from a separate `server-ci.yml`. Two workflows could not express the thing
  # that matters most: **a job cannot `needs:` a job in another workflow**, so the
  # release gate could never wait for the server's tests — and a branch-protection rule
  # naming a path-filtered workflow blocks forever on pull requests that skip it.
  #
  # Prefixed `server-` so a red check names which half of the workspace broke.
  # ── Check (all targets, all features) ───────────────────────────────────────
  server-check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/build-deps
      - run: cargo check -p rustcdc-server --all-targets --all-features --locked

  # ── Connector feature matrix ────────────────────────────────────────────────
  #
  # Connectors are opt-in cargo features so a PostgreSQL-only deployment does not link
  # tiberius and its rustls 0.21 stack. That only holds if every combination keeps
  # compiling, and nothing else in CI would notice a `#[cfg]` arm that stopped matching:
  # the other jobs all build `--all-features`, where every variant exists.
  #
  # `cargo check` rather than `--all-targets` on purpose. The property is that a narrow
  # *binary* builds; the test fixtures are PostgreSQL-shaped throughout, and gating each
  # one to compile under a MySQL-only build would be churn that asserts nothing.
  #
  # `--no-default-features` alone is deliberately absent: it is a `compile_error!` (see
  # `crates/rustcdc-server/src/lib.rs`), because a binary with no connector rejects every configuration.
  server-connector-matrix:
    name: Check (${{ matrix.features }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features:
          - postgres
          - mysql
          - sqlserver
          - postgres,mysql,sqlserver
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/build-deps
      - run: cargo check -p rustcdc-server --no-default-features --features ${{ matrix.features }} --locked

  # ── Test ────────────────────────────────────────────────────────────────────
  server-test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/build-deps
      - run: cargo test -p rustcdc-server --all-features --locked
      # State compatibility runs on its own line so a failure is unmistakable in the log:
      # it means this build cannot read state a previous one wrote, which is an upgrade
      # that breaks every existing pipeline rather than an ordinary test failure.
      - run: cargo test -p rustcdc-server --all-features --locked --test state_compatibility
      # The default feature set is PostgreSQL-only, which is what most deployments build
      # and what every test fixture here is shaped for. `--no-default-features` is not run:
      # it has no connector and is a `compile_error!` by design; `connector-matrix` covers
      # the narrow combinations.
      - run: cargo test -p rustcdc-server --locked

  # ── Integration (real databases and brokers) ────────────────────────────────
  #
  # The test manages its own container, so this job and a developer's local run are the
  # same command against the same fixture. `--test-threads=1` because the tests share one
  # container name and one host port on purpose: a killed run leaves exactly one thing to
  # clean up.
  #
  # `crates/rustcdc-server/tests/architecture.rs::every_integration_suite_is_run_by_ci` enumerates
  # `crates/rustcdc-server/tests/integration_*.rs` from disk and asserts each one is named here. Adding a
  # suite and forgetting to wire it up fails the unit suite rather than silently reporting
  # success — which is what an env-gated test that nobody runs does.
  server-integration:
    name: Integration (${{ matrix.suite }}${{ matrix.broker && format(' / {0}', matrix.broker) || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: integration_postgres
            container: rustcdc-integration-postgres
          - suite: integration_mysql
            container: rustcdc-integration-mysql
          # Two brokers, one suite. Redpanda is an independent reimplementation of the
          # Kafka wire protocol, so a green run against one says nothing about the other —
          # and this matrix proved it on its first run: Apache Kafka propagates new-topic
          # metadata asynchronously and elects a group coordinator lazily, neither of which
          # Redpanda does. A Redpanda-only suite would have shipped a harness incapable of
          # testing Kafka.
          - suite: integration_kafka
            broker: redpanda
            container: rustcdc-integration-kafka
          - suite: integration_kafka
            broker: kafka
            container: rustcdc-integration-kafka
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/build-deps
      - name: Run the ${{ matrix.suite }} suite
        env:
          RUSTCDC_INTEGRATION: "1"
          RUSTCDC_TEST_BROKER: ${{ matrix.broker }}
        run: cargo test -p rustcdc-server --all-features --locked --test ${{ matrix.suite }} -- --test-threads=1
      # Removes the container **this** job started. It used to remove
      # `rustcdc-integration-postgres` unconditionally, so the MySQL job cleaned up a
      # container it had never started and left its own running.
      - name: Clean up the container
        if: always()
        run: docker rm -f ${{ matrix.container }} || true

  # ── Fuzz targets (build + short smoke run) ──────────────────────────────────
  #
  # The invariants these targets check also run on stable, every build, in
  # `crates/rustcdc-server/tests/fuzz_properties.rs` — that suite is the continuous guarantee. This job
  # exists so the libFuzzer targets cannot silently stop compiling: an uncompilable fuzz
  # target is indistinguishable from a fuzz target nobody ever ran.
  #
  # 60 seconds each is a smoke test, not a campaign. Deep fuzzing is an on-demand
  # `cargo +nightly fuzz run <target>` with a corpus, not something on the pull-request
  # path.
  #
  # `crates/rustcdc-server/fuzz` is excluded from the workspace (it needs nightly and `cargo fuzz`), so
  # this runs from that directory rather than the repository root.
  server-fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: ./.github/actions/build-deps
        with:
          packages: protobuf-compiler cmake clang perl pkg-config
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz build
      - run: cargo +nightly fuzz run redact_secrets -- -max_total_time=60
      - run: cargo +nightly fuzz run config_loader -- -max_total_time=60

  # ── The one required status check ───────────────────────────────────────────
  #
  # Branch protection should require **this job and nothing else**.
  #
  # Requiring the individual jobs does not work. GitHub leaves a required check
  # `Pending` forever when its job never runs — and jobs here legitimately do not run (an
  # `if:` on the ref, a skipped matrix leg) — so a pull request would block on a check
  # that is never coming. Requiring one aggregator also means the protection rule does
  # not have to be edited every time a job is added or renamed.
  #
  # `if: always()` is essential: without it this job is skipped the moment any dependency
  # fails, and GitHub reads a *skipped* required check as success — the exact inversion
  # the rule exists to prevent.
  #
  # A skipped dependency is accepted; a failed or cancelled one is not.
  required-checks-passed:
    name: CI
    if: always()
    needs:
      - msrv
      - check
      - quality
      - transport-security
      - policy-gate
      - docs-site
      - correctness-smoke
      - reliability-core
      - latency-core
      - integration-postgres
      - integration-postgres-encryption
      - integration-reliability
      - integration-schema-registry
      - integration-mysql
      - integration-mysql-encryption
      - integration-mariadb
      - integration-mariadb-encryption
      - integration-sqlserver
      - integration-sqlserver-encryption
      - release-evidence
      - package
      - container-smoke
      - server-check
      - server-connector-matrix
      - server-test
      - server-integration
      - server-fuzz
    runs-on: ubuntu-latest
    steps:
      - name: every required job succeeded or was skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed="$(printf '%s' "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"
          ')"
          if [ -n "$failed" ]; then
            echo "::error::these jobs did not pass:"
            printf '%s\n' "$failed"
            exit 1
          fi
          echo "all required jobs passed"
