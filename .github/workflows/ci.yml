name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel redundant runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Format ──────────────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ── Lint ────────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang perl pkg-config
      # Both feature configurations. The second run is the *default* set (PostgreSQL
      # only) — the build a developer and a downstream consumer get without asking —
      # not `--no-default-features`, which is a `compile_error!` by design because a
      # binary with no source connector would reject every configuration at startup.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings

  # ── Check (all targets, all features) ───────────────────────────────────────
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang perl pkg-config
      - run: cargo check --all-targets --all-features --locked

  # ── Connector feature matrix ────────────────────────────────────────────────
  #
  # Connectors are opt-in cargo features so a PostgreSQL-only deployment does not link
  # tiberius and its rustls 0.21 stack. That only holds if every combination keeps
  # compiling, and nothing else in CI would notice a `#[cfg]` arm that stopped matching:
  # the other jobs all build `--all-features`, where every variant exists.
  #
  # `cargo check` rather than `--all-targets` on purpose. The property is that a narrow
  # *binary* builds; the test fixtures are PostgreSQL-shaped throughout, and gating each
  # one to compile under a MySQL-only build would be churn that asserts nothing.
  #
  # `--no-default-features` alone is deliberately absent: it is a `compile_error!` (see
  # `src/lib.rs`), because a binary with no connector rejects every configuration.
  connector-matrix:
    name: Check (${{ matrix.features }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features:
          - postgres
          - mysql
          - sqlserver
          - postgres,mysql,sqlserver
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang perl pkg-config
      - run: cargo check --no-default-features --features ${{ matrix.features }} --locked

  # ── Test ────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang perl pkg-config
      - run: cargo test --all-features --locked
      # State compatibility runs on its own line so a failure is unmistakable in the log:
      # it means this build cannot read state a previous one wrote, which is an upgrade
      # that breaks every existing pipeline rather than an ordinary test failure.
      - run: cargo test --all-features --locked --test state_compatibility
      # The default feature set is PostgreSQL-only, which is what most deployments build
      # and what every test fixture in this repository is shaped for. `--no-default-features`
      # is not run here: it has no connector and is a `compile_error!` by design; the
      # `connector-matrix` job covers the narrow combinations.
      - run: cargo test --locked

  # ── MSRV ────────────────────────────────────────────────────────────────────
  # `rust-version` in Cargo.toml is a promise to downstream consumers. Without a job
  # pinned to it, the promise is only ever tested against whatever `stable` happens to
  # be, and a newer-than-MSRV feature ships unnoticed.
  #
  # The toolchain is **read from Cargo.toml** rather than written here. This job used to
  # hardcode `1.94.0` while the manifest said `1.94`, which is two sources of truth for one
  # number and exactly how they drift: a dependency raised its own requirement, the pinned
  # job started failing, and nothing said which of the two values was wrong.
  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          test -n "$version" || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV is $version"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang perl pkg-config
      # Both feature sets: the default is what a plain `cargo build` resolves, and
      # `--all-features` adds the MySQL and SQL Server connectors and is what the shipped
      # container image builds. The declared MSRV has to satisfy the higher of the two.
      - run: cargo check --all-targets --locked
      - run: cargo check --all-targets --all-features --locked

  # ── Integration (real PostgreSQL) ───────────────────────────────────────────
  #
  # Until this job existed, **nothing in this repository ran against a real database**.
  # The pipeline was covered end to end by a scripted in-memory source, and every
  # database-touching test was env-gated and therefore skipped — so the suite was green
  # with the entire capture path unexercised. That mattered most exactly when it was least
  # visible: rustcdc 0.10 replaced the PostgreSQL WAL transport with a new wire client and
  # made it the default, and this job is the only thing that has ever run it here.
  #
  # The test manages its own container, so this job and a developer's local run are the
  # same command against the same fixture. `--test-threads=1` because the tests share one
  # container name and one host port on purpose: a killed run leaves exactly one thing to
  # clean up.
  #
  # `tests/architecture.rs::every_integration_suite_is_run_by_ci` enumerates
  # `tests/integration_*.rs` from disk and asserts each one is named here. Adding a suite
  # and forgetting to wire it up fails the unit suite rather than silently reporting
  # success — which is what an env-gated test that nobody runs does.
  #
  # One job per database, matrixed: they bind fixed host ports and fixed container names so
  # a killed run leaves exactly one thing to clean up, which means they must not share a
  # runner.
  integration:
    name: Integration (${{ matrix.suite }}${{ matrix.broker && format(' / {0}', matrix.broker) || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: integration_postgres
            container: rustcdc-integration-postgres
          - suite: integration_mysql
            container: rustcdc-integration-mysql
          # Two brokers, one suite. Redpanda is an independent reimplementation of the
          # Kafka wire protocol, so a green run against one says nothing about the other —
          # and this matrix proved it on its first run: Apache Kafka propagates new-topic
          # metadata asynchronously and elects a group coordinator lazily, neither of which
          # Redpanda does. A Redpanda-only suite would have shipped a harness incapable of
          # testing Kafka.
          - suite: integration_kafka
            broker: redpanda
            container: rustcdc-integration-kafka
          - suite: integration_kafka
            broker: kafka
            container: rustcdc-integration-kafka
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang perl pkg-config
      - name: Run the ${{ matrix.suite }} suite
        env:
          RUSTCDC_INTEGRATION: "1"
          RUSTCDC_TEST_BROKER: ${{ matrix.broker }}
        run: cargo test --all-features --locked --test ${{ matrix.suite }} -- --test-threads=1
      # Removes the container **this** job started. It used to remove
      # `rustcdc-integration-postgres` unconditionally, so the MySQL job cleaned up a
      # container it had never started and left its own running.
      - name: Clean up the container
        if: always()
        run: docker rm -f ${{ matrix.container }} || true

  # ── Fuzz targets (build + short smoke run) ──────────────────────────────────
  #
  # The invariants these targets check also run on stable, every build, in
  # `tests/fuzz_properties.rs` — that suite is the continuous guarantee. This job exists
  # so the libFuzzer targets cannot silently stop compiling: an uncompilable fuzz target
  # is indistinguishable from a fuzz target nobody ever ran.
  #
  # 60 seconds each is a smoke test, not a campaign. Deep fuzzing is an on-demand
  # `cargo +nightly fuzz run <target>` with a corpus, not something to put on the
  # pull-request path.
  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz build
        working-directory: .
      - run: cargo +nightly fuzz run redact_secrets -- -max_total_time=60
      - run: cargo +nightly fuzz run config_loader -- -max_total_time=60

  # ── Deny (license / duplicate dep audit) ────────────────────────────────────
  deny:
    name: Deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
