name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel redundant runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Format ──────────────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ── Lint ────────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang perl pkg-config
      # Both feature configurations. `glue` is off for a plain `cargo build` — that is
      # the configuration a developer and a downstream consumer get by default, and it
      # was never built in CI, so a `#[cfg(feature = "glue")]` boundary error could
      # compile green here and break on the first `cargo build`.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings

  # ── Check (all targets, all features) ───────────────────────────────────────
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang perl pkg-config
      - run: cargo check --all-targets --all-features --locked
      - run: cargo check --all-targets --no-default-features --locked

  # ── Test ────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang perl pkg-config
      - run: cargo test --all-features --locked
      - run: cargo test --no-default-features --locked

  # ── MSRV ────────────────────────────────────────────────────────────────────
  # `rust-version` in Cargo.toml is a promise to downstream consumers. Without a job
  # pinned to it, the promise is only ever tested against whatever `stable` happens to
  # be, and a newer-than-MSRV feature ships unnoticed.
  #
  # The toolchain is **read from Cargo.toml** rather than written here. This job used to
  # hardcode `1.94.0` while the manifest said `1.94`, which is two sources of truth for one
  # number and exactly how they drift: a dependency raised its own requirement, the pinned
  # job started failing, and nothing said which of the two values was wrong.
  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          test -n "$version" || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV is $version"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang perl pkg-config
      # Both feature sets, because they have different binding constraints: the default set
      # is held by wasmtime and `--all-features` by the AWS SDK that `glue` pulls in. The
      # declared MSRV has to satisfy the higher of the two, and the shipped container image
      # builds `--all-features`.
      - run: cargo check --all-targets --no-default-features --locked
      - run: cargo check --all-targets --all-features --locked

  # ── Fuzz targets (build + short smoke run) ──────────────────────────────────
  #
  # The invariants these targets check also run on stable, every build, in
  # `tests/fuzz_properties.rs` — that suite is the continuous guarantee. This job exists
  # so the libFuzzer targets cannot silently stop compiling: an uncompilable fuzz target
  # is indistinguishable from a fuzz target nobody ever ran.
  #
  # 60 seconds each is a smoke test, not a campaign. Deep fuzzing is an on-demand
  # `cargo +nightly fuzz run <target>` with a corpus, not something to put on the
  # pull-request path.
  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz build
        working-directory: .
      - run: cargo +nightly fuzz run redact_secrets -- -max_total_time=60
      - run: cargo +nightly fuzz run config_loader -- -max_total_time=60

  # ── Deny (license / duplicate dep audit) ────────────────────────────────────
  deny:
    name: Deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
