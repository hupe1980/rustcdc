[package]
name = "crash-workers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Crash-worker binaries the process-crash integration suites spawn as separate
# processes; a test cannot SIGKILL itself. Never published.
publish = false

[lints]
workspace = true

[features]
default = []
tls = ["rustcdc/tls"]
postgres = ["rustcdc/postgres"]
mysql = ["rustcdc/mysql"]
mariadb = ["rustcdc/mariadb"]
sqlserver = ["rustcdc/sqlserver", "tls"]

[dependencies]
rustcdc = { workspace = true }
tokio = { version = "1.48.0", features = ["macros", "rt", "time"] }
