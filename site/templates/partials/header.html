<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ get_url(path='/') }}" aria-label="rustcdc home">
      <svg class="brand-mark" width="26" height="26" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <path d="M16 3a13 13 0 1 1-9.2 3.8" fill="none" stroke="currentColor" stroke-width="3"
              stroke-linecap="round"/>
        <path d="M6 3v6h6" fill="none" stroke="currentColor" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="16" cy="16" r="3.5" fill="currentColor"/>
      </svg>
      <span class="brand-name">rustcdc</span>
    </a>

    <nav class="site-nav" aria-label="Main">
      <a href="{{ get_url(path='/docs/getting-started/') }}">Get started</a>
      <a href="{{ get_url(path='/docs/') }}">Docs</a>
      <a href="{{ get_url(path='/docs/configuration/') }}">Config</a>
      <a href="{{ get_url(path='/docs/api/') }}">API</a>
      <a href="{{ get_url(path='/docs/runbook/') }}">Runbook</a>
    </nav>

    <div class="header-actions">
      <button class="theme-toggle" type="button" aria-label="Switch between light and dark theme"
              title="Switch theme" data-theme-toggle>
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
          </g>
        </svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" fill="currentColor"/>
        </svg>
      </button>

      <a class="gh-link" href="{{ config.extra.repo }}" rel="noopener"
         aria-label="rustcdc-server on GitHub">
        <svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
            0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01

            0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0
            1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87
            3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16
            8c0-4.42-3.58-8-8-8Z"/>

  </div>
</header>
