<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="rustcdc — embeddable change data capture for Rust">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151c33"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9b6a"/>
      <stop offset="1" stop-color="#6f7bff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="90" r="300" fill="#ff9b6a" opacity="0.07"/>

  <g transform="translate(90 150)">
    <rect width="54" height="54" rx="12" fill="url(#mark)"/>
    <g fill="#fff" transform="translate(12 13)">
      <rect x="0" y="0"  width="22" height="5" rx="2.5"/>
      <rect x="0" y="11" width="30" height="5" rx="2.5"/>
      <rect x="0" y="22" width="15" height="5" rx="2.5"/>
    </g>
    <text x="72" y="40" fill="#e8ecf4" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="42" font-weight="700" letter-spacing="-1">rustcdc</text>
  </g>

  <text x="90" y="330" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">CDC you can embed,</text>
  <text x="90" y="404" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">not deploy.</text>

  <text x="90" y="474" fill="#99a3b8" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="30">PostgreSQL · MySQL · MariaDB · SQL Server — one Rust crate</text>

  <g transform="translate(90 520)">
    <rect width="330" height="52" rx="10" fill="#0e1526" stroke="#232c44"/>
    <text x="22" y="34" fill="#ff9b6a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">$ cargo add rustcdc</text>
  </g>
</svg>
