<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     role="img" aria-label="rustcdc — change data capture in Rust">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#131b35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a45"/>
      <stop offset="100%" stop-color="#74a3ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.8">
      <stop offset="0%" stop-color="#ff7a45" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- Mark -->
  <g transform="translate(84 78)">
    <path d="M26 4a22 22 0 1 1-15.6 6.5" fill="none" stroke="#ff7a45" stroke-width="6"
          stroke-linecap="round"/>
    <path d="M8 2v12h12" fill="none" stroke="#ff7a45" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="26" cy="26" r="6.5" fill="#ff7a45"/>
  </g>
  <text x="152" y="112" font-family="Helvetica, Arial, sans-serif" font-size="34"
        font-weight="700" fill="#e8ecf6" letter-spacing="-0.5">rustcdc</text>

  <!-- Headline -->
  <text x="84" y="252" font-family="Helvetica, Arial, sans-serif" font-size="82"
        font-weight="700" fill="#e8ecf6" letter-spacing="-2.5">Change data capture</text>
  <text x="84" y="348" font-family="Helvetica, Arial, sans-serif" font-size="82"
        font-weight="700" fill="url(#accent)" letter-spacing="-2.5">built in Rust</text>

  <!-- Sub -->
  <text x="84" y="412" font-family="Helvetica, Arial, sans-serif" font-size="27"
        fill="#a3adc8">PostgreSQL · MySQL · MariaDB · SQL Server  →  Kafka · Iceberg · HTTP · files</text>

  <!-- Chips -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#cfd6e4">
    <rect x="84" y="468" width="228" height="50" rx="25" fill="#ffffff" fill-opacity="0.07"
          stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="198" y="500" text-anchor="middle">Honest contracts</text>

    <rect x="328" y="468" width="212" height="50" rx="25" fill="#ffffff" fill-opacity="0.07"
          stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="434" y="500" text-anchor="middle">WASM transforms</text>

    <rect x="556" y="468" width="176" height="50" rx="25" fill="#ffffff" fill-opacity="0.07"
          stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="644" y="500" text-anchor="middle">Single binary</text>

    <rect x="748" y="468" width="150" height="50" rx="25" fill="#ffffff" fill-opacity="0.07"
          stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="823" y="500" text-anchor="middle">No JVM</text>
  </g>

  <text x="1116" y="566" text-anchor="end" font-family="Helvetica, Arial, sans-serif"
        font-size="20" fill="#7c87a5">github.com/hupe1980/rustcdc-server</text>
</svg>
