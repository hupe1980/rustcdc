<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="rustcdc">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0682f"/>
      <stop offset="1" stop-color="#6f7bff"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <!-- Three stacked rows flowing right: a change stream. -->
  <g fill="#fff">
    <rect x="7" y="9"  width="13" height="3" rx="1.5"/>
    <rect x="7" y="14.5" width="18" height="3" rx="1.5"/>
    <rect x="7" y="20" width="9"  height="3" rx="1.5"/>
  </g>
</svg>
