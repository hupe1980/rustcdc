# Zola configuration for the rustcdc documentation site.
#
# One site for one repository. `/docs/` is the server — the product most readers came
# for — and `/library/` is the `rustcdc` crate for embedders. They were two sites in two
# repositories publishing to two Pages targets, which meant two search indexes, two
# navigation trees and a cross-reference that could only be a bare URL.
#
# Build:  zola --root site build
# Serve:  zola --root site serve
# Check:  zola --root site check   (validates every internal and external link)
#
# `base_url` must match where the site is actually served, because it is what the
# canonical URL, the sitemap and the Open Graph tags are built from — all three are
# silently wrong if it drifts. Change it here and nowhere else; no template hard-codes
# a host. For a custom domain, set it here and add `static/CNAME`.
base_url = "https://hupe1980.github.io/rustcdc"

title = "rustcdc"
description = "Open-source change data capture in Rust. Stream row-level changes from PostgreSQL, MySQL, MariaDB and SQL Server to Kafka, Iceberg, HTTP or files — as a server, or as a crate you embed."

# UK spelling throughout the prose; this only affects Zola's own slug generation.
default_language = "en"

compile_sass = true

# Powers the client-side documentation search. Zola emits an elasticlunr index at
# build time, so search needs no server, no third-party service and no request that
# leaves the reader's browser.
build_search_index = true

# Zola 0.23 made every content file a Tera template, rendered *before* the markdown
# parser and with no protection for fenced code blocks. On a site that is mostly code
# samples that is a standing hazard: any Rust `format!` escape, Prometheus annotation,
# Helm value or Vue snippet containing `{{` fails the build, and the failure reads as a
# template error in a file that contains no template. Upstream considers this intended
# (getzola/zola#3263, closed "not going to happen by default").
#
# Skipping the pass for all content restores what 0.22 did. Nothing here wants Tera in
# prose: the one former shortcode had a single call site, and the number it inserted is
# now checked against the manifest by `server/tests/architecture.rs`, which is a stronger
# guarantee than an indirection that merely moved where the number was written.
skip_content_templating = ["**/*.md"]

# Every `@/…md` link is resolved at build time, so a renamed page fails the build
# instead of shipping a 404. This is the whole reason internal links use that syntax
# rather than plain relative paths.
[link_checker]
internal_level = "error"
external_level = "warn"

[markdown]
# Heading anchors are how deep links into the reference pages stay stable.
insert_anchor_links = "heading"
# Off: the reference pages are full of ASCII operators and quoted TOML, and turning
# `"` into typographic quotes inside prose that discusses literal syntax is a hazard.
smart_punctuation = false
# `> [!NOTE]` and friends render as callouts, which several pages already use in spirit.
github_alerts = true
external_links_target_blank = false
external_links_no_referrer = true

[markdown.highlighting]
# Solarized-dark reads well against both the light and dark page themes, which keeps one
# highlighting theme rather than shipping two stylesheets and switching between them.
theme = "solarized-dark"

[search]
include_title = true
include_description = true
include_path = true
# Truncated, not omitted: the full body of `configuration.md` alone would dominate the
# index and make the first load noticeably slower on a phone.
truncate_content_length = 400

[extra]
repo = "https://github.com/hupe1980/rustcdc"
repo_name = "hupe1980/rustcdc"
ghcr = "https://github.com/hupe1980/rustcdc/pkgs/container/rustcdc"
crate_url = "https://crates.io/crates/rustcdc"
docs_rs_url = "https://docs.rs/rustcdc"
license = "MIT OR Apache-2.0"
# Shown in the header and in the structured data. Checked against the workspace
# manifest by `server/tests/architecture.rs`, so it cannot drift.
version = "0.15.0"
rust_version = "1.94.1"
# Used for the Open Graph and Twitter card images.
og_image = "/og.png"
author = "hupe1980"

