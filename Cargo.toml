[package]
name = "rustcdc-server"
version = "0.4.0"
edition = "2021"
# The shipped container image builds `--all-features`, so this is the requirement for the
# artifact users actually consume. The default feature set alone still builds on 1.94.0
# (wasmtime is the binding constraint there); the AWS SDK, pulled in only by `glue`, is
# what needs 1.94.1. Declaring the lower number would be true for a `cargo build` and false
# for the published image, and would hand anyone enabling `glue` a resolver error instead
# of a documented requirement.
rust-version = "1.94.1"
publish = false
description = "Change-data-capture server powered by rustcdc"
repository = "https://github.com/hupe1980/rustcdc-server"
license = "MIT OR Apache-2.0"

[[bin]]
name = "rustcdc"
path = "src/main.rs"


[workspace]
resolver = "2"
# The libFuzzer targets need a nightly toolchain and `cargo fuzz`. Excluding them keeps
# `cargo build` on stable from depending on either; `tests/fuzz_properties.rs` carries the
# same invariants on stable so CI still checks them on every commit.
exclude = ["fuzz"]

[workspace.lints.rust]
unsafe_code = "forbid"

# ─────────────────────────────────────────────────────────────────────────────
# Features
# ─────────────────────────────────────────────────────────────────────────────
#
# **Connectors are opt-in, and the default is PostgreSQL alone.**
#
# They used to be compiled unconditionally, which meant a PostgreSQL-only deployment
# still linked `tiberius` — and with it a *second* TLS stack (rustls 0.21, its own
# webpki, its own X.509 verifier) carrying four suppressed RUSTSEC advisories that the
# admin listener and every sink, on rustls 0.23, do not have. Each suppression in
# `deny.toml` carries a real reachability analysis showing the path is unreachable in a
# PostgreSQL deployment, and that is still true — but "unreachable in your configuration"
# is not an answer any scanner, auditor or procurement questionnaire accepts, and it
# makes a minimal-attack-surface claim unarguable.
#
# The published container image builds with `--all-features`, so the shipped artifact
# carries every connector and loses nothing. Only a source build narrows.
#
# A config naming a connector that was not compiled in is rejected at load with a message
# naming the feature to rebuild with — see `reject_uncompiled_source_driver`. It is never
# a serde "unknown variant" error, and it never silently loads.
[features]
default = ["postgres"]

# PostgreSQL logical replication. The default, and the only connector most deployments
# need. Adds no TLS stack of its own beyond rustls 0.23, which is already present.
postgres = ["rustcdc/postgres"]

# MySQL and MariaDB binlog. One feature, because MariaDB's connector is a thin layer over
# MySQL's upstream (`rustcdc/mariadb` implies `rustcdc/mysql`) and splitting them would
# offer a build that cannot exist.
mysql = ["rustcdc/mysql", "rustcdc/mariadb"]

# SQL Server CDC. **This is the one that costs.** `tiberius 0.12` pins rustls 0.21, so
# enabling it re-adds the second TLS stack and the four suppressed advisories documented
# in `deny.toml`. Enable it when you capture SQL Server; the analysis says it is safe, and
# a deployment that does not need it should not have to rely on that analysis.
sqlserver = ["rustcdc/sqlserver"]

# AWS Glue Schema Registry as a codec backend.
#
# Off for a plain `cargo build` because it pulls the AWS SDK (~45 crates) that no
# other deployment needs; **on** in the published container image, which builds with
# `--all-features`, so the shipped artifact carries every backend.
glue = ["rustcdc/glue", "dep:aws-config", "dep:aws-sdk-glue"]

[dependencies]
# `default-features = false` so that `rustcdc/postgres` — which is in rustcdc's own
# default set — arrives through *our* `postgres` feature and nowhere else. Without it,
# `--no-default-features` here would still drag the PostgreSQL connector in, and the
# feature split would be decorative.
rustcdc = { version = "0.12.0", default-features = false, features = [
    "tls",
    "metrics",
    "avro",
    "schemreg",
    "apicurio",
    "protobuf",
    "wasm",
    "cloudevents",
    "encryption",
    "outbox",
] }

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "process"] }
futures = "0.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Layered configuration
figment = { version = "0.10", features = ["toml", "env"] }

# Web / admin API
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "catch-panic"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = "0.23"
# PEM parsing comes from rustls-pki-types, not the unmaintained `rustls-pemfile`
# (RUSTSEC-2025-0134) — `PemObject` is the same implementation that crate's final
# release wrapped, and it keeps one PEM parser in the tree alongside rustcdc 0.8.
rustls-pki-types = { version = "1", features = ["std"] }
url = "2"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.32" }
# `default-features = false` to drop `logs`, which nothing here exports.
#
# `reqwest-blocking-client` is deliberate and **not** an oversight: the OTLP/HTTP exporter
# is driven by the SDK's batch processor, which runs on its own dedicated OS thread
# (`OpenTelemetry.Traces.BatchProcessor`) with no tokio reactor attached. The async
# `reqwest-client` panics there with "there is no reactor running" on the first export —
# caught by `the_http_protocol_actually_speaks_otlp_over_http`, which drives a real
# exporter at a real socket rather than asserting the config mapping.
#
# `reqwest-rustls` keeps the exporter on the one TLS stack this project links.
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "grpc-tonic",
    "http-proto",
    "reqwest-blocking-client",
    "reqwest-rustls",
    "trace",
    "metrics",
    "internal-logs",
] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "metrics"] }
tracing-opentelemetry = "0.33"

# Error handling
thiserror = "2"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
hex = "0.4"
ed25519-dalek = "2"
zip = "2"
async-trait = "0.1"
dashmap = "6"
bytes = "1"
tokio-postgres = "0.7"
# One crypto backend for the whole process (aws-lc-rs, matching the provider
# installed in main.rs) and every compression codec the docs offer (zstd is not
# in krafka's default set — without compression-all a `compression = "zstd"`
# config would fail validation at startup).
krafka = { version = "0.18.0", default-features = false, features = ["compression-all", "rustls-aws-lc-rs", "oauth-oidc", "native-tls-roots", "socks5"] }

# AWS SDK, only for the optional `glue` feature: the Glue registry client is
# constructed from an `aws_sdk_glue::Client`, which needs the credential chain.
aws-config = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest", "rustls"] }
aws-sdk-glue = { version = "1", optional = true, default-features = false, features = ["rustls"] }

iceberg = "0.10.1"
iceberg-catalog-rest = "0.10.1"
iceberg-storage-opendal = { version = "0.10.1", features = ["opendal-fs", "opendal-s3", "opendal-gcs", "opendal-azdls"] }
arrow-array = "58"
arrow-schema = "58"
parquet = "58"

# Storage abstraction (E02-S03) — pinned to the same major as iceberg-storage-opendal
# so the state backends and the Iceberg sink share one opendal in the graph.
opendal = { version = "0.57", features = ["services-fs", "services-s3", "services-gcs", "services-azblob", "services-redis", "services-postgresql"] }

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "throughput"
harness = false

[dev-dependencies]
# Drives the real axum router in-process, so the security suite probes the same
# middleware, extractors and handlers a network client would hit — not a
# hand-called function that skips the layers where a bypass would live.
tower = { version = "0.5", features = ["util"] }
# Statistical benchmarking with baseline comparison — the regression gate for the
# hot path (CR-004). `default-features = false` drops the unmaintained `plotters`
# tree; cargo-deny flags it and the HTML report is not what CI consumes.
# `async_tokio` for `benches/throughput.rs`, which measures the real async batch path.
# `default-features = false` still drops the unmaintained `plotters` tree that cargo-deny
# flags; the HTML report is not what CI consumes.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support", "async_tokio"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "process", "test-util"] }
# test-harnesses: rustcdc's `testkit::AdapterConformanceSuite`, so the sinks are
# checked against the library's own adapter contract instead of a local restatement.
rustcdc = { version = "0.12.0", features = ["test-harnesses"] }
wat = "1"
# test-broker: krafka's in-process fake Kafka broker — real protocol round-trips
# in unit tests without Docker.
krafka = { version = "0.18.0", default-features = false, features = ["compression-all", "rustls-aws-lc-rs", "oauth-oidc", "native-tls-roots", "socks5", "test-broker"] }

# Benchmarks compile against the dev-dependency graph, which carries rustcdc's
# `test-harnesses` feature (the delivery-contract tests need its fault injection).
# That feature refuses to build with `debug_assertions` off, on the sound principle
# that fault-injection code has no business in an optimised artefact. Keeping the
# assertions on for `cargo bench` satisfies the guard while retaining `opt-level = 3`,
# so the numbers still reflect optimised code. Compare benchmarks only against
# baselines taken with this same profile.
[profile.bench]
debug-assertions = true
