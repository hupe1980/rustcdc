[package]
name = "rustcdc"
version = "0.10.0"
edition = "2021"
rust-version = "1.94"
description = "Embeddable Rust CDC library focused on correctness-first capture primitives"
authors      = ["hupe1980"]
license = "MIT OR Apache-2.0"
repository   = "https://github.com/hupe1980/rustcdc"
homepage     = "https://github.com/hupe1980/rustcdc"
documentation = "https://docs.rs/rustcdc"
readme       = "README.md"
keywords     = ["cdc", "change-data-capture"]
categories   = ["database", "asynchronous", "data-structures"]

[workspace]
members = [".", "xtask"]
default-members = ["."]
resolver = "2"

[features]
# Default production profile: PostgreSQL source with TLS. Lean by design — no JIT runtime in the
# default binary. Add --features wasm explicitly if WASM transforms are needed.
default = ["postgres", "tls"]
# Enable PostgreSQL-specific source implementations.
#
# Two clients: `tokio-postgres` for ordinary SQL, and rustcdc's own replication client
# (`source::postgres::wire`) for the WAL stream, because `tokio-postgres` exposes no
# replication-mode API. `hmac`/`base64` are for its SCRAM-SHA-256, `md-5` for MD5 auth.
postgres = [
    "dep:tokio-postgres",
    "dep:tokio-postgres-rustls",
    "dep:hmac",
    "dep:base64",
    "dep:md-5",
    "tls",
]
# Enable MySQL-specific source implementations.
mysql = ["dep:mysql_async", "dep:mysql_common", "mysql_async/rustls-tls", "mysql_async/ring", "tls"]
# Enable MariaDB CDC support. Uses the MySQL binlog connector under the hood;
# MariaDB-specific protocol differences (GTID format, system variable names,
# capability flags) are handled transparently by the shared connector code.
mariadb = ["mysql"]
# Enable SQL Server-specific source implementations.
#
# SECURITY: this feature negotiates TLS with a *different, older* stack than the rest of
# the crate. Everything else here is on rustls 0.23; tiberius 0.12.3 hard-pins
# tokio-rustls 0.24, so enabling this adds rustls 0.21 / rustls-webpki 0.101.7 —
# carrying RUSTSEC-2026-0098, -0099 and -0104, plus the unmaintained rustls-pemfile 1.0
# via rustls-native-certs 0.6. Not deduplicable and not fixable from here: it needs a
# tiberius release built against rustls 0.23. Per-advisory reachability analysis and
# mitigations are in site/content/docs/security.md; the suppressions are in deny.toml.
sqlserver = ["dep:tiberius", "tls"]
# Enable TLS-related transport support for source connectors.
tls = ["dep:rustls", "dep:rustls-native-certs", "dep:tokio-rustls"]
# Enable WASM-based transform execution (wasmtime + wasmparser). Required for
# loading `.wasm` modules as event transforms. Safe to disable when WASM
# transforms are not used to reduce the binary size significantly.
wasm = ["dep:wasmtime", "dep:wasmparser"]
# Enable outbox helpers and transforms.
outbox = []
# Enable encryption-oriented transforms and helpers.
encryption = ["dep:aes-gcm", "dep:base64", "dep:hkdf", "dep:hmac"]
# Enable metrics and instrumentation integrations.
metrics = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]
# Enable fault-injection and chaos-testing primitives (FaultInjectingSource, FaultInjectingCheckpoint,
# CrashSimulationValidator, DataLossValidator). Must NOT be enabled in production builds.
test-harnesses = []
# Enable CloudEvents 1.0 structured JSON encoding (no additional dependencies).
cloudevents = []
# Enable Protocol Buffer binary encoding via prost.
protobuf = ["dep:prost"]
# Enable Apache Avro binary encoding via apache-avro.
avro = ["dep:apache-avro"]
# Enable Confluent Schema Registry integration (Avro, JSON Schema wire framing, schema registration/lookup,
# subject naming strategies). Delegates HTTP, caching, and wire format to the `schemreg` crate.
schemreg = ["dep:schemreg", "schemreg/confluent", "schemreg/json", "schemreg/protobuf", "dep:apache-avro", "dep:bytes", "dep:prost-reflect", "avro", "protobuf", "dep:protox", "dep:prost"]
# Enable the Apicurio Registry v3 native REST API as a schema-registry backend.
#
# Apicurio also exposes a Confluent-compatible endpoint that the `schemreg` feature can
# already talk to; this uses the native v3 API instead, which exposes artifact groups and
# richer metadata that the compatibility shim flattens away.
apicurio = ["schemreg", "schemreg/apicurio"]
# Enable the AWS Glue Schema Registry as a backend.
#
# Glue uses its own 18-byte wire header (not the Confluent 5-byte one) and identifies
# schemas by UUID rather than by integer id, so it is a distinct encode/decode path rather
# than a drop-in registry swap: `GlueAvroEncoder` / `GlueAvroDecoder`, not the Confluent
# pair. Pulls in the AWS SDK.
#
# EVIDENCE: Glue has no self-hostable implementation, so this is the one registry backend
# with no live-service test. Everything rustcdc owns is covered against an in-memory fake;
# the AWS transport itself belongs to `schemreg`. See site/content/docs/api.md.
glue = ["schemreg", "schemreg/glue"]

[dependencies]
async-trait = "0.1.89"
ahash = { version = "0.8.11", features = ["serde"] }
futures-util = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt", "signal", "sync", "time", "fs", "io-util"] }
tracing = "0.1.41"
regex = "1.11.1"
wasmparser = { version = "0.255", optional = true }
wasmtime = { version = "47", optional = true }
aes-gcm = { version = "0.11", optional = true }
base64 = { version = "0.23", optional = true }
hkdf = { version = "0.13", optional = true }
hmac = { version = "0.13", optional = true }
# MD5 password authentication: deprecated by PostgreSQL, still configured on many servers.
md-5 = { version = "0.11", optional = true }
opentelemetry = { version = "0.32", features = ["trace", "metrics"], optional = true }
opentelemetry_sdk = { version = "0.32", features = ["trace", "metrics", "rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.32", features = ["trace", "metrics", "grpc-tonic"], optional = true }
tokio-postgres = { version = "0.7.15", optional = true }
tokio-postgres-rustls = { version = "0.14", optional = true }
zeroize = { version = "1", features = ["alloc"] }
mysql_async = { version = "0.37", default-features = false, features = ["minimal", "binlog"], optional = true }
mysql_common = { version = "0.37", default-features = false, features = ["binlog"], optional = true }
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "tokio", "rustls"], optional = true }
tokio-util = { version = "0.7.16", features = ["compat"] }
rustls = { version = "0.23.19", default-features = false, features = ["std", "ring"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
prost = { version = "0.14", optional = true }
prost-reflect = { version = "0.16", optional = true }
apache-avro = { version = "0.21", optional = true }
bytes = { version = "1", optional = true }
schemreg = { version = "0.4", default-features = false, features = ["confluent", "json"], optional = true }

[build-dependencies]
# Pure-Rust protobuf compiler: builds the descriptor set for Confluent Protobuf framing
# without requiring `protoc` on the building machine.
protox = { version = "0.9", optional = true }
prost = { version = "0.14", optional = true }

[dev-dependencies]
criterion = "0.8"
# Validates real events against the published `EVENT_JSON_SCHEMA`. Pinned to the same
# version `schemreg` validates with, so the test agrees with the encoder rather than with
# a second implementation's reading of the spec.
jsonschema = { version = "0.46", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "mysql", "json"] }
tempfile = "3.23.0"
testcontainers = "0.27"
tokio-test = "0.4.4"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "std", "json"] }
reqwest = { version = "0.12.5", default-features = false, features = ["json", "rustls-tls"] }
wasm-bindgen = "0.2.105"
wat = "1.240.0"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }

[[bench]]
name = "quality_perf"
harness = false

[[bench]]
name = "cdc_perf"
harness = false
required-features = ["wasm"]

[[test]]
name = "wasm_conformance_contract"
required-features = ["wasm"]

[[test]]
name = "wasm_runtime_integration"
required-features = ["wasm"]

[[test]]
name = "fault_injection_soak_matrix"
required-features = ["test-harnesses"]

[[test]]
name = "crash_recovery_model"
required-features = ["test-harnesses"]

[[test]]
name = "data_loss_detection"
required-features = ["test-harnesses"]
