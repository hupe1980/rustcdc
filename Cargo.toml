# rustcdc — workspace root.
#
# This manifest defines no package. See `crates/` for the crates themselves:
#
#   crates/rustcdc         the library, published to crates.io
#   crates/rustcdc-server  the server binary and container image
#   crates/crash-workers   binaries the process-crash suites spawn
#   crates/xtask           the `cargo xtask` task runner
#
[workspace]
# A virtual manifest: the root defines the workspace and owns nothing itself. Every crate
# lives under `crates/`, so `cargo package` collects one crate's directory and nothing else
# — a package at the root would collect the whole repository.
members = ["crates/*"]
# `cargo build` builds the product: library *and* server binary. `crash-workers` and `xtask`
# are members but not default ones: the suites build the workers, `cargo xtask` builds the
# runner. CI addresses packages explicitly with `-p`, because a bare `--features …` is
# ambiguous across members.
default-members = ["crates/rustcdc", "crates/rustcdc-server"]
# The libFuzzer targets need a nightly toolchain and `cargo fuzz`. Excluding them keeps
# `cargo build` on stable from depending on either; `crates/rustcdc-server/tests/fuzz_properties.rs`
# carries the same invariants on stable so CI still checks them on every commit.
exclude = ["crates/rustcdc-server/fuzz"]
resolver = "2"

# One version for the repository. The library and the server ship from the same commit
# and are tested only against each other, so a split version line would encode a
# compatibility question that does not exist.
[workspace.package]
version = "0.20.0"
edition = "2024"
# `wasmtime` 50 sets this floor; krafka 0.29 and iceberg 0.11 are the next constraint at
# 1.95. Declaring a lower number would hand anyone a resolver error instead of a documented
# requirement.
# It covers the server with every feature, which is what the MSRV job checks: `wasm` is
# optional, but a floor that only held for the default build is not the one the image needs.
rust-version = "1.97.0"
authors = ["hupe1980"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/rustcdc"
homepage = "https://hupe1980.github.io/rustcdc"

# Dependencies shared by more than one crate, declared once.
#
# The internal `rustcdc` dependency carries a version alongside its path: `cargo publish`
# requires it, `cargo deny` reports a bare path as a wildcard, and without it a published
# `rustcdc-server` could not resolve the library.
#
# The third-party entries hold the members on one version, so the workspace cannot resolve
# two copies of the same crate. A member narrows what it takes with
# `default-features = false` and adds the features it needs; it cannot pick its own version.
[workspace.dependencies]
rustcdc = { path = "crates/rustcdc", version = "0.20.0", default-features = false }

base64 = "0.23"
bytes = "1"
# `default-features = false` where a member needs to narrow: cargo refuses a member that
# turns defaults *off* when the workspace entry leaves them on, so the workspace states
# the narrower position and whoever wants the defaults asks for them.
criterion = { version = "0.8", default-features = false }
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false }
opentelemetry_sdk = "0.32"
sha2 = "0.11"

[workspace.lints.rust]
# The escape hatch in `crates/rustcdc/src/fault_injection/mod.rs`, declared so
# `unexpected_cfgs` does not warn on it. `cargo xtask bench` sets it; never set it in a
# shipped binary.
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(rustcdc_optimised_test_harnesses)",
    # Set by `crates/rustcdc/build.rs` when the documentation site is present.
    "cfg(rustcdc_markdown_doctests)",
] }
# `deny`, not `forbid`, because `forbid` cannot be locally overridden and two sites need
# `unsafe`: the library's Windows PID-liveness probe (`checkpoint/owner_lease.rs`, Win32
# FFI) and the server's `test_env.rs` (`std::env::set_var`, unsafe in Rust 2024). Each
# carries `#[allow(unsafe_code)]` with a safety comment; the server binary still forbids it.
# `unsafe_code_appears_only_where_the_allowlist_says_it_may` in
# `crates/rustcdc-server/tests/architecture.rs` holds both crates to those two files.
unsafe_code = "deny"
