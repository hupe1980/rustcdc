# rustcdc — workspace root.
#
# This manifest defines no package. See `crates/` for the crates themselves:
#
#   crates/rustcdc         the library, published to crates.io
#   crates/rustcdc-server  the server binary and container image
#   crates/xtask           crash-worker binaries the integration suites spawn
#
[workspace]
# A virtual manifest: the root defines the workspace and owns nothing itself.
#
# Every crate lives under `crates/`, so `cargo package` collects one crate's directory
# and nothing else. While the library sat at the root it was *also* the workspace root,
# and `cargo package` vacuumed the entire repository — the server, its fuzz corpus, the
# demo stack, the CI scripts — which had to be held back by a hand-maintained `exclude`
# list that grew with every new top-level directory.
members = ["crates/*"]
# `cargo build` builds the product: library *and* server binary. `xtask` is a member but
# not a default one — it holds the crash-worker binaries the integration suites spawn, and
# building them is the suites' job. CI addresses packages explicitly with `-p`, because a
# bare `--features …` is ambiguous across members.
default-members = ["crates/rustcdc", "crates/rustcdc-server"]
# The libFuzzer targets need a nightly toolchain and `cargo fuzz`. Excluding them keeps
# `cargo build` on stable from depending on either; `crates/rustcdc-server/tests/fuzz_properties.rs`
# carries the same invariants on stable so CI still checks them on every commit.
exclude = ["crates/rustcdc-server/fuzz"]
resolver = "2"

# One version for the repository. The library and the server ship from the same commit
# and are tested only against each other, so a split version line would encode a
# compatibility question that does not exist.
[workspace.package]
version = "0.15.0"
edition = "2024"
# The AWS SDK sets this floor; wasmtime is the next constraint at 1.94.0. Declaring the
# lower number would hand anyone a resolver error instead of a documented requirement.
rust-version = "1.94.1"
authors = ["hupe1980"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/rustcdc"
homepage = "https://github.com/hupe1980/rustcdc"

# Dependencies shared by more than one crate, declared once.
#
# Two things this buys. The internal `rustcdc` dependency carries a version alongside its
# path, which is what `cargo publish` needs and what stops `cargo deny` reporting it as a
# wildcard; without the version, a published `rustcdc-server` could never resolve it.
#
# And the third-party entries stop the members drifting apart. They had: the library was
# on `base64 0.23` and `criterion 0.8` while the server was on `0.22` and `0.7`, so one
# workspace resolved two copies of each — a duplicate `base64` that `deny.toml` had been
# told to tolerate rather than fix. A member still narrows what it takes with
# `default-features = false` and adds the features it needs; it cannot pick its own
# version.
[workspace.dependencies]
rustcdc = { path = "crates/rustcdc", version = "0.15.0", default-features = false }

base64 = "0.23"
bytes = "1"
# `default-features = false` where a member needs to narrow: cargo refuses a member that
# turns defaults *off* when the workspace entry leaves them on, so the workspace states
# the narrower position and whoever wants the defaults asks for them.
criterion = { version = "0.8", default-features = false }
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false }
opentelemetry_sdk = "0.32"
sha2 = "0.11"

[workspace.lints.rust]
# The escape hatch in `crates/rustcdc/src/fault_injection/mod.rs`, declared so
# `unexpected_cfgs` does not warn on it. `cargo xtask bench` sets it; never set it in a
# shipped binary.
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(rustcdc_optimised_test_harnesses)",
    # Set by `crates/rustcdc/build.rs` when the documentation site is present.
    "cfg(rustcdc_markdown_doctests)",
] }
# `deny`, not `forbid`: the Windows PID-liveness probe in `checkpoint::owner_lease` needs
# one tightly-scoped `unsafe` block for the Win32 `OpenProcess`/`GetExitCodeProcess` FFI,
# and the server's `test_env` needs `std::env::set_var`, which Rust 2024 makes unsafe.
# `forbid` cannot be locally overridden, so it made the library impossible to compile for
# `*-pc-windows-*` targets. Every exception carries an explicit `#[allow(unsafe_code)]`
# with a safety comment, and `crates/rustcdc-server/tests/architecture.rs` holds the allowlist.
unsafe_code = "deny"
