# cargo-deny policy for the rustcdc workspace (library + server).
# https://embarkstudios.github.io/cargo-deny/
#
# Run:  cargo deny check
# CI:   the `policy-gate` job in .github/workflows/ci.yml, on every pull request.
#
# One policy for one workspace: the library and the server are checked against the same
# graph and the same allowlists.

[graph]
# Resolve the dependency graph with every feature enabled. Without this the graph is
# built from default features only, and every optional dependency — the wasmtime JIT, the
# crypto stack, mysql_async, tiberius, opentelemetry, apache-avro — is invisible to the
# advisory, license and ban checks. An advisory against any of them would not fail the gate.
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# ── Advisories ────────────────────────────────────────────────────────────────
[advisories]
# Deny any crate with an unmitigated security advisory.
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # RUSTSEC-2024-0436: paste 1.x — proc-macro soundness issue, no safe upgrade available.
    # Risk: compile-time only; no runtime code executed from paste macros in our codebase.
    # Blocked until upstream paste releases a fixed version.
    { id = "RUSTSEC-2024-0436" },

    # RUSTSEC-2023-0071: rsa 0.9.x — Marvin timing side-channel in PKCS#1 v1.5 decryption.
    # No safe upgrade available. Affected path: rsa <- reqsign-azure-storage <-
    # opendal-service-azblob <- opendal, i.e. only Azure request signing. Nothing here
    # performs RSA decryption. Remove when reqsign releases against rsa >= 0.10.
    { id = "RUSTSEC-2023-0071" },

    # RUSTSEC-2026-0440: astral-tokio-tar is unmaintained (2026-11-03). Reached only through
    # testcontainers, a dev-dependency of rustcdc (`cargo tree -i astral-tokio-tar -e all`),
    # so it is in no published crate and no image. testcontainers 0.27 (current) and 0.28 both
# depend on it.
    # Remove when testcontainers moves off it.
    { id = "RUSTSEC-2026-0440" },
]

# ── Licenses ──────────────────────────────────────────────────────────────────
[licenses]
version = 2
allow = [
    "MIT",
    # MIT-0: MIT No Attribution (OSI approved; strictly more permissive than MIT).
    # Used by borrow-or-share (via fluent-uri -> jsonschema -> schemreg -> rustcdc).
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # CDLA-Permissive-2.0: Community Data License Agreement Permissive.
    # Used by webpki-roots (trusted root CA certificates bundle).
    # Permissive — permits use, reproduction, modification, and redistribution.
    "CDLA-Permissive-2.0",
    # BSL-1.0: Boost Software License. OSI-approved and FSF Free/Libre; permissive,
    # with no attribution requirement for binary distribution. Used by xxhash-rust
    # (via redis <- opendal's Redis state backend).
    "BSL-1.0",
]

# ── Bans ──────────────────────────────────────────────────────────────────────
[bans]
# Deny duplicate major versions of the same crate to prevent supply-chain
# confusion; use `skip` to allow intentional duplication with justification.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

# Crates that must never appear in the dependency graph.
deny = [
    # Deprecated / unmaintained TLS backends.
    { name = "native-tls" },
    { name = "openssl-sys" },
    # Avoid the unsound `atty` crate (GHSA-g98v-hv3f-hcfr).
    { name = "atty" },
]

# ── Skip justification guide ───────────────────────────────────────────────
# To audit new duplicates:  cargo tree -d 2>/dev/null | grep '(*)'
# To see why a crate is duplicated: cargo tree -d -i <crate-name>
# Every skip entry must cite the root-cause dependency in a group comment.
# Remove entries when the upstream diamond is resolved.
# ──────────────────────────────────────────────────────────────────────────
skip = [
    # Root causes (verified 2026-11-09 with
    # `cargo tree -i <crate>@<version> --target all -e normal,build`):
    #   - zstd / zstd-safe 0.13 vs 0.14: apache-avro 0.21 (pinned by iceberg 0.11) vs krafka
    #       0.29's `zstd` feature. Resolves when iceberg moves to apache-avro 0.22.
    #   - strum / strum_macros 0.27 vs 0.28: apache-avro 0.21 (iceberg) vs jsonschema 0.61
    #       (schemreg 0.7). Same trigger.
    #   - asyncband 0.6 vs 0.7: fastpool (opendal-service-redis) vs reqsign-azure-storage
    #       (opendal-service-azblob) — inside opendal 0.58's own service crates.
    #   - spin 0.9 vs 0.10: lazy_static <- num-bigint-dig <- rsa 0.9 <- reqsign-azure-storage,
    #       vs crc-fast <- opendal-service-s3. Inside opendal 0.58; resolves with rsa 0.10
    #       (the same trigger as RUSTSEC-2023-0071 above).
    { name = "zstd" },
    { name = "zstd-safe" },
    { name = "strum" },
    { name = "strum_macros" },
    { name = "asyncband" },
    { name = "spin" },
    # RustCrypto generation split: rustcdc is on the 0.11 RustCrypto generation
    # (aes-gcm 0.11, sha2 0.11, hkdf 0.13) while iceberg 0.11 still pins aes-gcm 0.10
    # for its Puffin/KMS encryption. Both are pure-Rust AEAD implementations of the
    # same primitive; neither can move without its parent. Revisit when iceberg-rust
    # upgrades aes-gcm.
    { name = "aead" },
    { name = "aes" },
    { name = "aes-gcm" },
    { name = "cipher" },
    { name = "ctr" },
    { name = "ghash" },
    { name = "hkdf" },
    { name = "inout" },
    { name = "polyval" },
    { name = "universal-hash" },
    # sha1: mysql_common 0.37 (rustcdc) uses 0.10; reqsign-aws-core 3.x (opendal S3
    # signing) uses 0.11. SHA-1 here is protocol framing — MySQL native auth and AWS
    # SigV4 canonicalisation — not a security decision either crate makes.
    { name = "sha1" },
    # reqwest: iceberg 0.11 pins 0.12; opendal-core 0.58 and schemreg 0.7 are on 0.13.
    # All are configured rustls-only by their parents. Resolves when iceberg follows.
    { name = "reqwest" },
    # wasm-encoder / logos*: wasmtime 50's own tooling crates (wasm-compose, wast) and
    # protox sit on different minors. Compile-time and module-validation only.
    { name = "logos" },
    { name = "logos-codegen" },
    { name = "logos-derive" },
    # petgraph / fixedbitset: wasm-compose (a wasmtime 50 tooling crate) pins petgraph
    # 0.6, which brings fixedbitset 0.4; the rest of the tree is on petgraph 0.8. Graph
    # data structures used at module-composition time only.
    { name = "petgraph" },
    { name = "fixedbitset" },
    # unicode-width: clap 4 uses 0.2; older diagnostics crates in the wasmtime tree
    # use 0.1. Display-width tables only.
    { name = "unicode-width" },
    # Crypto version diamonds.
    # Root causes (against the krafka 0.29 / iceberg 0.11 / tiberius 0.13 graph —
    # `cargo tree -i <crate>@<version> --target all -e all`):
    #   - webpki-roots / const-oid: 0.26 / 0.9 generation still reached through older
    #       transitive crates alongside 1.x / 0.10
    #   - base64: opendal/reqsign are on 0.23; older transitive crates on 0.21/0.22
    #   - sha2 / hmac / md-5 / digest / block-buffer / crypto-common / cpufeatures:
    #       the RustCrypto 0.10→0.11 generation change; rustcdc is on 0.11, while
    #       krafka, mysql_common, sqlx, rsa, ed25519-dalek, wasmtime and the Zerobus SDK
    #       are on 0.10
    #   - rand / rand_chacha / rand_core / getrandom: 0.8 vs 0.9 split across the
    #       database drivers and the newer crates
    #   - hashbrown: dashmap 6 on 0.14, sqlx and petgraph 0.8 on 0.15, wasmtime's gimli
    #       on 0.16, arrow and opendal on 0.17
    { name = "base64" },
    { name = "block-buffer" },
    { name = "const-oid" },
    { name = "cpufeatures" },
    { name = "crypto-common" },
    { name = "digest" },
    { name = "getrandom" },
    { name = "hashbrown" },
    { name = "hmac" },
    { name = "md-5" },
    { name = "rand" },
    { name = "rand_chacha" },
    { name = "rand_core" },
    { name = "sha2" },
    { name = "webpki-roots" },
    # Miscellaneous minor version diamonds in shared utilities.
    # Root causes:
    #   - darling / darling_core / darling_macro: proc-macro crates used by both
    #       old and new serde/derive crates in the graph
    #   - itertools / ordered-float: iceberg-rust and opendal disagree on the minor
    #   - quick-xml: opendal-core 0.58 is on 0.41 while another branch of the graph
    #       is already on 0.42
    #   - socket2: older tokio vs newer tokio/hyper version split
    #   - serde_spanned / toml / toml_datetime / winnow: figment and the server's config
    #       loader use toml 0.8; wasmtime-internal-cache uses toml 1.x
    #   - thiserror / thiserror-impl: 1.x through the Zerobus SDK and krafka
    #       (tokio-socks); everything else is on 2.x
    #   - foldhash: hashbrown 0.15 uses 0.1, hashbrown 0.17 uses 0.2
    { name = "darling" },
    { name = "darling_core" },
    { name = "darling_macro" },
    { name = "foldhash" },
    { name = "itertools" },
    { name = "ordered-float" },
    { name = "quick-xml" },
    { name = "serde_spanned" },
    { name = "socket2" },
    { name = "thiserror" },
    { name = "thiserror-impl" },
    { name = "toml" },
    { name = "toml_datetime" },
    { name = "winnow" },
    # Compression / wasm-tooling diamonds: lz4_flex and wasm-encoder are pulled at
    # different minors by krafka's LZ4 codec, iceberg's parquet, and wasmtime's own
    # tooling crates; whoami by two independent telemetry paths.
    { name = "lz4_flex" },
    { name = "wasm-encoder" },
    { name = "whoami" },
    # miniz_oxide: apache-avro 0.21 depends on 0.8 directly for its deflate codec, while
    # every other DEFLATE user in the tree — krafka, parquet, iceberg, mysql_common,
    # schemreg — reaches 0.9 through flate2 1.1. One pure-Rust implementation of one format
    # at two minors. Resolves when apache-avro follows flate2.
    { name = "miniz_oxide" },
    # syn 2.x vs 3.x: proc-macro ecosystem mid-transition; both versions are
    # compile-time only.
    { name = "syn" },
    # prettyplease: the same transition one layer up. 0.2 arrives through prost-build and
    # tonic-build, which run in the Zerobus SDK's build script; 0.3 through bon-macros via
    # apache-avro. It pretty-prints generated code at build time and no part of either
    # copy is linked into the binary.
    { name = "prettyplease" },
    # num-bigint: redis 1.7 — reached through opendal's `services-redis`, which backs the
    # Redis state store — moved to 0.5 while the rest of the tree is still on 0.4:
    # arrow-buffer and parquet, apache-avro through bigdecimal, mysql_common, and
    # jsonschema through schemreg. Arbitrary-precision integer arithmetic, no unsafe
    # surface on either side. Resolves when those follow redis.
    { name = "num-bigint" },
]

# ── Sources ───────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
