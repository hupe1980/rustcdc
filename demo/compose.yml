# =============================================================================
# rustcdc-server demo
#
# What this demo shows
# ─────────────────────
#   1. Initial snapshot  — rustcdc emits a "read" event for every existing row
#                          (customers, products, orders) before streaming begins.
#   2. Streaming CDC     — a seeder service continuously INSERTs new customers
#                          and orders, UPDATEs statuses (pending → shipped →
#                          delivered), and DELETEs old rows. Each change arrives
#                          as a JSON event in real time.
#   3. Admin API         — /status, /livez, /readyz, and /metrics on port 8080.
#
# Services
# ─────────
#   postgres  — PostgreSQL 16 with wal_level=logical
#   rustcdc   — the CDC pipeline; creates its own state dirs on first start
#   seeder    — generates ongoing changes every 2 s
#
# Requirements
# ─────────────
#   Docker Engine ≥ 23 with Compose v2 (docker compose version)
#   amd64 or arm64 host
#
# Usage
# ─────
#   docker compose up              # start everything; events scroll in the logs
#   docker compose up --no-log-prefix  # cleaner output (Compose ≥ 2.20)
#   docker compose stop            # pause (state is preserved on the volume)
#   docker compose down -v         # full reset, removes all volumes
# =============================================================================

services:

  # ── PostgreSQL source ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB:       demo
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    # Enable logical replication and allow enough replication connections.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    volumes:
      # init.sql runs once on first container start (skipped if pg-data exists).
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "5432:5432"    # exposed for optional local psql inspection

  # ── Main CDC pipeline ───────────────────────────────────────────────────────
  # For local-fs state the `run` command bootstraps its own state directories;
  # no separate init-state step is needed (init-state is Kafka-topic state only).
  rustcdc:
    build:
      context: ..          # workspace root (the server links the library at `.`)
      dockerfile: demo/Dockerfile   # fast debug build — not for production
    image: rustcdc-demo
    depends_on:
      postgres:
        condition: service_healthy
    # Pin the hostname so the owner-lease identity is stable across container
    # restarts (Docker assigns a new random hostname on each recreation otherwise,
    # which causes a lease-conflict crash-loop with local-fs state).
    hostname: rustcdc
    volumes:
      - ./cdc.toml:/etc/rustcdc/config.toml:ro
      - cdc-state:/var/lib/rustcdc
    ports:
      - "8080:8080"    # admin API: /status /livez /readyz /metrics
    environment:
      RUSTCDC_LOG_LEVEL: "info"
      # Demo-only admin tokens — the non-loopback admin bind requires auth.
      # curl usage: -H "Authorization: Bearer rustcdc-demo-read-token"
      RUSTCDC_ADMIN_READ_TOKEN: "rustcdc-demo-read-token"
      RUSTCDC_ADMIN_WRITE_TOKEN: "rustcdc-demo-write-token"
      # HMAC key for the customer-name masking rule in cdc.toml. Demo-only —
      # in production this comes from a secret manager, and rotating it changes
      # every pseudonym it has ever produced.
      RUSTCDC_DEMO_PII_KEY: "rustcdc-demo-pii-key-not-for-production"
      # The loader refuses a literal source password: a replication credential in a
      # config file is readable by anyone who can read the file, and it grants read
      # access to every captured table. Demo-only value; use a secret manager in
      # production.
      RUSTCDC_DEMO_SOURCE_PASSWORD: "cdc_password"
    command: ["run", "--config-file", "/etc/rustcdc/config.toml"]
    restart: unless-stopped

  # ── Seeder: generates continuous INSERT / UPDATE / DELETE events ────────────
  seeder:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./seed.sh:/seed.sh:ro
    entrypoint: ["/bin/bash", "/seed.sh"]
    restart: unless-stopped

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  pg-data:    # PostgreSQL data directory
  cdc-state:  # rustcdc checkpoint + schema history
